[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "petrichor-crns"
version = "0.1.0"
description = "Convert cosmic-ray neutron counts to soil moisture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zhicheng Li" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scipy",
  "beautifulsoup4"
]

[project.urls]
Homepage = "https://github.com/<your-account>/<your-repo>"
Issues = "https://github.com/<your-account>/<your-repo>/issues"

[project.scripts]
petrichor = "petrichor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]